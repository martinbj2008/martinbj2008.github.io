<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SONiC 新增 IP 地址 · 时序图</title>
  <style>
    :root { color-scheme: light; font-family: Arial, "Microsoft YaHei", sans-serif; color: #263238; background: #f2f5f8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; }
    main { max-width: 1920px; margin: auto; }
    h1 { margin: 0 0 12px; color: #1565c0; font-size: clamp(24px, 4vw, 32px); }
    p { line-height: 1.8; }
    a { color: #1565c0; text-underline-offset: 3px; }
    nav, .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    nav { margin: 20px 0; }
    nav a, button { padding: 9px 13px; border: 1px solid #c6d4e0; border-radius: 6px; background: white; color: #1565c0; font: inherit; }
    nav a { text-decoration: none; }
    button { cursor: pointer; }
    button[aria-pressed="true"] { background: #1565c0; color: white; border-color: #1565c0; }
    a:focus-visible, button:focus-visible, .viewport:focus-visible { outline: 3px solid #1565c0; outline-offset: 3px; }
    .controls { margin-bottom: 24px; }
    .controls[hidden] { display: none; }
    #zoom-status { font-size: 14px; color: #52616b; }
    figure { margin: 0 0 28px; padding: 18px; background: white; border: 1px solid #dce3ea; border-radius: 12px; scroll-margin-top: 16px; }
    .viewport { overflow: auto; }
    .viewport img { display: block; width: var(--diagram-width, 100%); max-width: none; height: auto; }
    figcaption { padding-top: 14px; font-size: 15px; line-height: 1.8; }
    figcaption a { margin-left: 12px; white-space: nowrap; }
    summary { padding: 14px 0; cursor: pointer; font-weight: 700; color: #1565c0; }
    footer { font-size: 14px; color: #52616b; }
    @media (max-width: 600px) { body { padding: 20px 10px; } figure { padding: 6px; } figcaption { padding: 10px; } }
    @media print { body { background: white; padding: 0; } nav, .controls { display: none; } figure { break-inside: avoid; border: 0; padding: 0; } .viewport img { width: 100%; } }
  </style>
</head>
<body>
<main>
  <header>
    <h1>SONiC：如何处理新增的 IP 地址</h1>
    <p>10 个参与者共用一组生命线，17 个步骤从上向下连续排列，分为配置下发、接口处理、路由分发和路由下发四个阶段。</p>
    <nav aria-label="图示版本">
      <a href="#complete">完整时序图</a>
      <a href="#comparison">四张分图对照</a>
    </nav>
    <div class="controls" hidden>
      <span>图示大小</span>
      <button type="button" data-zoom="100" aria-pressed="true">适应宽度</button>
      <button type="button" data-zoom="150" aria-pressed="false">150%</button>
      <button type="button" data-zoom="200" aria-pressed="false">200%</button>
      <button type="button" data-zoom="native" aria-pressed="false">原始尺寸</button>
      <span id="zoom-status" role="status">适应宽度；也可打开 SVG 原图查看。</span>
    </div>
  </header>
  <figure id="complete">
    <div class="viewport" tabindex="0" role="region" aria-label="新增 IP 地址完整时序图">
      <img src="../images/sonic-ip-address/00-complete.svg" width="1880" height="1930" alt="完整时序：10 个参与者、17 个步骤，依次展示配置下发、地址通知与接口处理、路由通知与分发、接口状态与路由下发。">
    </div>
    <figcaption>完整时序 · 窄屏下可选择“原始尺寸”，横向滚动阅读消息文字。<a href="../images/sonic-ip-address/00-complete.svg">打开 SVG 原图</a></figcaption>
  </figure>
  <details id="comparison">
    <summary>展开四张分图对照</summary>
  <figure id="config">
    <div class="viewport" tabindex="0" role="region" aria-label="配置下发时序图">
      <img src="../images/sonic-ip-address/01-config.svg" width="960" height="530" alt="步骤 1–3：User/CLI 写入 CONFIG_DB 的 INTERFACE，intfmgrd 订阅配置并向 Linux Kernel 发送 RTM_NEWADDR。">
    </div>
    <figcaption>01 · 配置下发：User/CLI → CONFIG_DB → intfmgrd → Linux Kernel。<a href="../images/sonic-ip-address/01-config.svg">打开 SVG 原图</a></figcaption>
  </figure>
  <figure id="interface">
    <div class="viewport" tabindex="0" role="region" aria-label="接口处理时序图">
      <img src="../images/sonic-ip-address/02-interface.svg" width="960" height="685" alt="步骤 4–7：Linux Kernel 通知 fpmsyncd，后者写入 APP_DB 的 INTF_TABLE；IntfOrch 订阅后处理 RIF、MyStation MAC 和 IP2ME Trap。">
    </div>
    <figcaption>02 · 地址通知经 INTF_TABLE 传递到 IntfOrch，接续接口处理。<a href="../images/sonic-ip-address/02-interface.svg">打开 SVG 原图</a></figcaption>
  </figure>
  <figure id="route">
    <div class="viewport" tabindex="0" role="region" aria-label="路由分发时序图">
      <img src="../images/sonic-ip-address/03-route.svg" width="960" height="700" alt="步骤 8–12：原图中 fpmsyncd 丢弃 RTN_LOCAL 通知；RTN_UNICAST 经 APP_DB 的 ROUTE_TABLE 传递给 RouteOrch。">
    </div>
    <figcaption>03 · 路由分发：保留原图的 RTN_LOCAL Drop 分支与 RTN_UNICAST 路径。<a href="../images/sonic-ip-address/03-route.svg">打开 SVG 原图</a></figcaption>
  </figure>
  <figure id="programming">
    <div class="viewport" tabindex="0" role="region" aria-label="路由下发时序图">
      <img src="../images/sonic-ip-address/04-programming.svg" width="960" height="765" alt="步骤 13–17：RouteOrch 查询 IntfOrch 的 RIF 状态，调用 SAI，接收状态，再按原图表示写入 ASIC_DB。">
    </div>
    <figcaption>04 · 查询 RIF 状态并下发路由；实线表示消息，虚线表示返回。<a href="../images/sonic-ip-address/04-programming.svg">打开 SVG 原图</a></figcaption>
  </figure>
  </details>
  <footer>图示按原文重绘，步骤编号、参与者和箭头方向保持一致。</footer>
</main>
<script>
  const controls = document.querySelector('.controls');
  controls.hidden = false;
  controls.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-zoom]');
    if (!button) return;
    const zoom = button.dataset.zoom;
    document.documentElement.style.setProperty('--diagram-width', `${zoom === 'native' ? '100' : zoom}%`);
    controls.querySelectorAll('button').forEach((item) => {
      item.setAttribute('aria-pressed', String(item === button));
    });
    document.querySelectorAll('.viewport img').forEach((img) => {
      img.style.width = zoom === 'native' ? `max(100%, ${img.getAttribute('width')}px)` : '';
    });
    document.querySelector('#zoom-status').textContent = zoom === 'native'
      ? '按原始尺寸显示，可横向滚动查看。'
      : zoom === '100' ? '适应宽度；也可打开 SVG 原图查看。'
      : `已放大到 ${zoom}%，可横向滚动查看。`;
    document.querySelectorAll('.viewport').forEach((item) => { item.scrollLeft = 0; });
  });
</script>
</body>
</html>
