<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="280" viewBox="0 0 1380 280">
  <defs>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="0" refY="5"
            markerWidth="6" markerHeight="6" orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="1380" height="280" fill="#FAFAFA"/>

  <text x="40" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
        fill="#1565C0" dominant-baseline="central">offload_base 链表（net/core/dev.c）</text>
  <text x="40" y="58" font-family="Arial, sans-serif" font-size="12" fill="#666"
        dominant-baseline="central">按 ETH_P_* 类型匹配的 GRO/GSO 卸载节点，由 dev_add_offload() 按 priority 排序插入</text>

  <text x="40" y="92" font-family="monospace" font-size="13" font-weight="bold"
        fill="#333" dominant-baseline="central">struct list_head offload_base</text>

  <!-- 链表头 -->
  <rect x="40" y="150" width="110" height="60" rx="6" ry="6" fill="#E3F2FD"/>
  <text x="95" y="172" font-family="monospace" font-size="13" font-weight="bold"
        fill="#0D47A1" text-anchor="middle" dominant-baseline="central">offload_base</text>
  <text x="95" y="192" font-family="monospace" font-size="10" fill="#1565C0"
        text-anchor="middle" dominant-baseline="central">struct list_head</text>
  <rect x="40" y="150" width="110" height="60" rx="6" ry="6"
        fill="none" stroke="#1565C0" stroke-width="1.5"/>

  <path d="M 150 180 L 170 180" fill="none" stroke="#000000" stroke-width="1.8"
        marker-end="url(#arrow-black)"/>

  <!-- ===================================================== -->
  <!-- 节点 1：IPv4 -->
  <!-- ===================================================== -->
  <rect x="180" y="108" width="254" height="144" rx="6" ry="6" fill="#FFFFFF"/>
  <rect x="180" y="108" width="254" height="26" rx="6" ry="6" fill="#E8F5E9"/>
  <rect x="180" y="122" width="254" height="12" fill="#E8F5E9"/>
  <text x="192" y="121" font-family="monospace" font-size="12" font-weight="bold"
        fill="#2E7D32" dominant-baseline="central">ipv4_packet_offload</text>

  <text x="190" y="152" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">type    <tspan fill="#888">:</tspan> <tspan fill="#C62828" font-weight="bold">ETH_P_IP (0x0800)</tspan></text>

  <text x="190" y="171" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">priority<tspan fill="#888">:</tspan> <tspan fill="#37474F" font-weight="bold">0</tspan></text>

  <text x="190" y="192" font-family="monospace" font-size="12" font-weight="bold"
        fill="#1565C0" dominant-baseline="central">callbacks</text>

  <rect x="184" y="202" width="240" height="42" rx="4" ry="4"
        fill="none" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="190" y="217" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">gro_receive <tspan fill="#888">:</tspan> <tspan fill="#1B5E20" font-weight="bold">inet_gro_receive</tspan></text>

  <text x="190" y="235" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">gro_complete<tspan fill="#888">:</tspan> <tspan fill="#1B5E20" font-weight="bold">inet_gro_complete</tspan></text>

  <rect x="180" y="108" width="254" height="144" rx="6" ry="6"
        fill="none" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="180" y1="134" x2="434" y2="134" stroke="#2E7D32" stroke-width="1.5"/>

  <path d="M 434 180 L 464 180" fill="none" stroke="#000000" stroke-width="1.8"
        marker-end="url(#arrow-black)"/>

  <!-- ===================================================== -->
  <!-- 节点 2：IPv6 -->
  <!-- ===================================================== -->
  <rect x="464" y="108" width="254" height="144" rx="6" ry="6" fill="#FFFFFF"/>
  <rect x="464" y="108" width="254" height="26" rx="6" ry="6" fill="#E3F2FD"/>
  <rect x="464" y="122" width="254" height="12" fill="#E3F2FD"/>
  <text x="476" y="121" font-family="monospace" font-size="12" font-weight="bold"
        fill="#0D47A1" dominant-baseline="central">ipv6_packet_offload</text>

  <text x="474" y="152" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">type    <tspan fill="#888">:</tspan> <tspan fill="#C62828" font-weight="bold">ETH_P_IPV6 (0x86DD)</tspan></text>

  <text x="474" y="171" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">priority<tspan fill="#888">:</tspan> <tspan fill="#37474F" font-weight="bold">0</tspan></text>

  <text x="474" y="192" font-family="monospace" font-size="12" font-weight="bold"
        fill="#1565C0" dominant-baseline="central">callbacks</text>

  <rect x="468" y="202" width="247" height="42" rx="4" ry="4"
        fill="none" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="474" y="217" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">gro_receive <tspan fill="#888">:</tspan> <tspan fill="#1B5E20" font-weight="bold">inet6_gro_receive</tspan></text>

  <text x="474" y="235" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">gro_complete<tspan fill="#888">:</tspan> <tspan fill="#1B5E20" font-weight="bold">inet6_gro_complete</tspan></text>

  <rect x="464" y="108" width="254" height="144" rx="6" ry="6"
        fill="none" stroke="#1565C0" stroke-width="1.5"/>
  <line x1="464" y1="134" x2="718" y2="134" stroke="#1565C0" stroke-width="1.5"/>

  <path d="M 718 180 L 748 180" fill="none" stroke="#000000" stroke-width="1.8"
        marker-end="url(#arrow-black)"/>

  <!-- ===================================================== -->
  <!-- 节点 3：MPLS -->
  <!-- ===================================================== -->
  <rect x="748" y="108" width="254" height="144" rx="6" ry="6" fill="#FFFFFF"/>
  <rect x="748" y="108" width="254" height="26" rx="6" ry="6" fill="#F3E5F5"/>
  <rect x="748" y="122" width="254" height="12" fill="#F3E5F5"/>
  <text x="760" y="121" font-family="monospace" font-size="12" font-weight="bold"
        fill="#4A148C" dominant-baseline="central">mpls_packet_offload</text>

  <text x="758" y="152" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">type    <tspan fill="#888">:</tspan> <tspan fill="#C62828" font-weight="bold">ETH_P_MPLS_UC</tspan></text>

  <text x="758" y="171" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">priority<tspan fill="#888">:</tspan> <tspan fill="#37474F" font-weight="bold">0</tspan></text>

  <text x="758" y="192" font-family="monospace" font-size="12" font-weight="bold"
        fill="#1565C0" dominant-baseline="central">callbacks</text>

  <rect x="752" y="202" width="240" height="42" rx="4" ry="4"
        fill="none" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="758" y="217" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">gro_receive <tspan fill="#888">:</tspan> <tspan fill="#1B5E20" font-weight="bold">mpls_gro_receive</tspan></text>

  <text x="758" y="235" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">gro_complete<tspan fill="#888">:</tspan> <tspan fill="#1B5E20" font-weight="bold">mpls_gro_complete</tspan></text>

  <rect x="748" y="108" width="254" height="144" rx="6" ry="6"
        fill="none" stroke="#7B1FA2" stroke-width="1.5"/>
  <line x1="748" y1="134" x2="1002" y2="134" stroke="#7B1FA2" stroke-width="1.5"/>

  <path d="M 1002 180 L 1032 180" fill="none" stroke="#000000" stroke-width="1.8"
        marker-end="url(#arrow-black)"/>

  <!-- ===================================================== -->
  <!-- 节点 4：VLAN -->
  <!-- ===================================================== -->
  <rect x="1032" y="108" width="254" height="144" rx="6" ry="6" fill="#FFFFFF"/>
  <rect x="1032" y="108" width="254" height="26" rx="6" ry="6" fill="#FFF8E1"/>
  <rect x="1032" y="122" width="254" height="12" fill="#FFF8E1"/>
  <text x="1044" y="121" font-family="monospace" font-size="12" font-weight="bold"
        fill="#E65100" dominant-baseline="central">vlan_packet_offload</text>

  <text x="1042" y="152" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">type    <tspan fill="#888">:</tspan> <tspan fill="#C62828" font-weight="bold">ETH_P_8021Q</tspan></text>

  <text x="1042" y="171" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">priority<tspan fill="#888">:</tspan> <tspan fill="#37474F" font-weight="bold">10</tspan></text>

  <text x="1042" y="192" font-family="monospace" font-size="12" font-weight="bold"
        fill="#1565C0" dominant-baseline="central">callbacks</text>

  <rect x="1036" y="202" width="240" height="42" rx="4" ry="4"
        fill="none" stroke="#90A4AE" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="1042" y="217" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">gro_receive <tspan fill="#888">:</tspan> <tspan fill="#1B5E20" font-weight="bold">vlan_gro_receive</tspan></text>

  <text x="1042" y="235" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central" xml:space="preserve">gro_complete<tspan fill="#888">:</tspan> <tspan fill="#1B5E20" font-weight="bold">vlan_gro_complete</tspan></text>

  <rect x="1032" y="108" width="254" height="144" rx="6" ry="6"
        fill="none" stroke="#E65100" stroke-width="1.5"/>
  <line x1="1032" y1="134" x2="1286" y2="134" stroke="#E65100" stroke-width="1.5"/>

  <path d="M 1286 180 L 1316 180" fill="none" stroke="#000000" stroke-width="1.8"
        marker-end="url(#arrow-black)"/>

  <text x="1324" y="180" font-family="monospace" font-size="14" font-weight="bold"
        fill="#B0BEC5" text-anchor="start" dominant-baseline="central">NULL</text>

</svg>
