<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
  <rect width="1280" height="700" fill="#FAFAFA"/>

  <!-- ===================================================== -->
  <!-- 顶部：数组声明 -->
  <!-- ===================================================== -->
  <rect x="50" y="20" width="1180" height="68" rx="6" ry="6"
        fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="70" y="46" font-family="Arial" font-size="14" font-weight="bold"
        fill="#1565C0" dominant-baseline="central">net/ipv4/protocol.c</text>
  <text x="70" y="70" font-family="monospace" font-size="12" fill="#0D47A1"
        dominant-baseline="central">const struct net_offload __rcu *inet_offloads[MAX_INET_PROTOS] __read_mostly;</text>
  <text x="1210" y="70" font-family="Arial" font-size="11" fill="#888"
        text-anchor="end" dominant-baseline="central">MAX_INET_PROTOS = 256</text>

  <!-- ===================================================== -->
  <!-- 数组：单列表格 -->
  <!-- ===================================================== -->
  <text x="50" y="128" font-family="Arial" font-size="13" font-weight="bold"
        fill="#333" dominant-baseline="central">inet_offloads[] 数组</text>
  <text x="230" y="128" font-family="Arial" font-size="11" fill="#888"
        dominant-baseline="central">（每一格 = 一个 protocol 槽位）</text>

  <!-- 单列表格 -->
  <rect x="50" y="145" width="220" height="172" rx="5" ry="5"
        fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.5"/>

  <!-- 表头 -->
  <rect x="50" y="145" width="220" height="30" rx="5" ry="5"
        fill="#ECEFF1" stroke="#90A4AE" stroke-width="1"/>
  <rect x="50" y="160" width="220" height="15" fill="#ECEFF1"/>
  <text x="160" y="160" font-family="monospace" font-size="12" font-weight="bold"
        fill="#455A64" text-anchor="middle" dominant-baseline="central">下标</text>

  <!-- 行分隔 -->
  <line x1="50" y1="175" x2="270" y2="175" stroke="#CFD8DC" stroke-width="1"/>
  <line x1="50" y1="211" x2="270" y2="211" stroke="#CFD8DC" stroke-width="1"/>
  <line x1="50" y1="247" x2="270" y2="247" stroke="#CFD8DC" stroke-width="1"/>
  <line x1="50" y1="283" x2="270" y2="283" stroke="#CFD8DC" stroke-width="1"/>

  <!-- 行：IPPROTO_TCP -->
  <rect x="50" y="175" width="220" height="36" fill="#E8F5E9"/>
  <text x="160" y="193" font-family="monospace" font-size="12" font-weight="bold"
        fill="#2E7D32" text-anchor="middle" dominant-baseline="central">IPPROTO_TCP</text>

  <!-- 行：... -->
  <text x="160" y="229" font-family="monospace" font-size="11" fill="#B0BEC5"
        text-anchor="middle" dominant-baseline="central">NULL</text>

  <!-- 行：IPPROTO_UDP -->
  <rect x="50" y="247" width="220" height="36" fill="#FFF8E1"/>
  <text x="160" y="265" font-family="monospace" font-size="12" font-weight="bold"
        fill="#E65100" text-anchor="middle" dominant-baseline="central">IPPROTO_UDP</text>

  <!-- 行：... -->
  <text x="160" y="301" font-family="monospace" font-size="11" fill="#B0BEC5"
        text-anchor="middle" dominant-baseline="central">NULL</text>

  <!-- 数组 -> TCP 结构体 箭头 -->
  <path d="M 270 193 C 350 193, 370 240, 420 240"
        fill="none" stroke="#43A047" stroke-width="2"
        marker-end="url(#arrow-green)"/>

  <!-- 数组 -> UDP 结构体 箭头 -->
  <path d="M 270 265 C 350 265, 370 240, 420 260"
        fill="none" stroke="#FF8F00" stroke-width="2"
        marker-end="url(#arrow-orange)"/>

  <!-- ===================================================== -->
  <!-- TCP 结构体 -->
  <!-- ===================================================== -->
  <rect x="430" y="150" width="380" height="200" rx="6" ry="6"
        fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
  <rect x="430" y="150" width="380" height="30" rx="6" ry="6"
        fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <rect x="430" y="166" width="380" height="14" fill="#E8F5E9"/>
  <text x="444" y="168" font-family="monospace" font-size="12" font-weight="bold"
        fill="#2E7D32" dominant-baseline="central">struct net_offload</text>
  <text x="796" y="168" font-family="Arial" font-size="10" fill="#888"
        text-anchor="end" dominant-baseline="central">tcpv4_offload</text>

  <text x="450" y="202" font-family="monospace" font-size="12" fill="#333"
        dominant-baseline="central">flags</text>
  <text x="660" y="202" font-family="monospace" font-size="12" fill="#333"
        text-anchor="middle" dominant-baseline="central">0</text>

  <text x="450" y="230" font-family="monospace" font-size="12" font-weight="bold"
        fill="#1565C0" dominant-baseline="central">callbacks</text>

  <text x="474" y="256" font-family="monospace" font-size="12" fill="#444"
        dominant-baseline="central">gso_segment</text>
  <text x="650" y="256" font-family="monospace" font-size="12" fill="#0D47A1"
        dominant-baseline="central">→ tcp4_gso_segment</text>

  <text x="474" y="282" font-family="monospace" font-size="12" fill="#444"
        dominant-baseline="central">gro_receive</text>
  <text x="650" y="282" font-family="monospace" font-size="12" fill="#0D47A1"
        dominant-baseline="central">→ tcp4_gro_receive</text>

  <text x="474" y="308" font-family="monospace" font-size="12" fill="#444"
        dominant-baseline="central">gro_complete</text>
  <text x="650" y="308" font-family="monospace" font-size="12" fill="#0D47A1"
        dominant-baseline="central">→ tcp4_gro_complete</text>

  <!-- ===================================================== -->
  <!-- UDP 结构体 -->
  <!-- ===================================================== -->
  <rect x="840" y="150" width="380" height="200" rx="6" ry="6"
        fill="#FFFFFF" stroke="#FF8F00" stroke-width="1.5"/>
  <rect x="840" y="150" width="380" height="30" rx="6" ry="6"
        fill="#FFF8E1" stroke="#FF8F00" stroke-width="1.5"/>
  <rect x="840" y="166" width="380" height="14" fill="#FFF8E1"/>
  <text x="854" y="168" font-family="monospace" font-size="12" font-weight="bold"
        fill="#E65100" dominant-baseline="central">struct net_offload</text>
  <text x="1206" y="168" font-family="Arial" font-size="10" fill="#888"
        text-anchor="end" dominant-baseline="central">udpv4_offload</text>

  <text x="860" y="202" font-family="monospace" font-size="12" fill="#333"
        dominant-baseline="central">flags</text>
  <text x="1070" y="202" font-family="monospace" font-size="12" fill="#333"
        text-anchor="middle" dominant-baseline="central">0</text>

  <text x="860" y="230" font-family="monospace" font-size="12" font-weight="bold"
        fill="#1565C0" dominant-baseline="central">callbacks</text>

  <text x="884" y="256" font-family="monospace" font-size="12" fill="#444"
        dominant-baseline="central">gso_segment</text>
  <text x="1060" y="256" font-family="monospace" font-size="12" fill="#0D47A1"
        dominant-baseline="central">→ udp4_ufo_fragment</text>

  <text x="884" y="282" font-family="monospace" font-size="12" fill="#444"
        dominant-baseline="central">gro_receive</text>
  <text x="1060" y="282" font-family="monospace" font-size="12" fill="#0D47A1"
        dominant-baseline="central">→ udp4_gro_receive</text>

  <text x="884" y="308" font-family="monospace" font-size="12" fill="#444"
        dominant-baseline="central">gro_complete</text>
  <text x="1060" y="308" font-family="monospace" font-size="12" fill="#0D47A1"
        dominant-baseline="central">→ udp4_gro_complete</text>

  <!-- ===================================================== -->
  <!-- 底部代码区 -->
  <!-- ===================================================== -->

  <rect x="50" y="400" width="580" height="200" rx="6" ry="6"
        fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1"/>

  <text x="70" y="426" font-family="Arial" font-size="13" font-weight="bold"
        fill="#1565C0" dominant-baseline="central">inet_add_offload() 调用（注册）</text>

  <text x="70" y="456" font-family="monospace" font-size="12" fill="#333"
        dominant-baseline="central">int inet_add_offload(const struct net_offload *prot,</text>
  <text x="70" y="476" font-family="monospace" font-size="12" fill="#333"
        dominant-baseline="central">                     unsigned char protocol)</text>
  <text x="70" y="496" font-family="monospace" font-size="12" fill="#333"
        dominant-baseline="central">{</text>
  <text x="90" y="516" font-family="monospace" font-size="12" fill="#1565C0"
        dominant-baseline="central">return !cmpxchg((const struct net_offload **)</text>
  <text x="110" y="536" font-family="monospace" font-size="12" fill="#1565C0"
        dominant-baseline="central">&amp;inet_offloads[protocol], NULL, prot) ? 0 : -1;</text>
  <text x="70" y="556" font-family="monospace" font-size="12" fill="#333"
        dominant-baseline="central">}</text>

  <rect x="90" y="570" width="520" height="22" rx="3"
        fill="#FFFDE7" stroke="#FFB300" stroke-width="0.8"/>
  <text x="100" y="581" font-family="monospace" font-size="11" fill="#E65100"
        dominant-baseline="central">inet_add_offload(&amp;tcpv4_offload, IPPROTO_TCP);</text>

  <rect x="90" y="594" width="520" height="22" rx="3"
        fill="#FFFDE7" stroke="#FFB300" stroke-width="0.8"/>
  <text x="100" y="605" font-family="monospace" font-size="11" fill="#E65100"
        dominant-baseline="central">inet_add_offload(&amp;udpv4_offload, IPPROTO_UDP);</text>

  <rect x="660" y="400" width="580" height="200" rx="6" ry="6"
        fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1"/>

  <text x="680" y="426" font-family="Arial" font-size="13" font-weight="bold"
        fill="#1565C0" dominant-baseline="central">struct net_offload（include/net/protocol.h）</text>

  <text x="680" y="456" font-family="monospace" font-size="12" fill="#333"
        dominant-baseline="central">struct net_offload {</text>
  <text x="700" y="478" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central">struct offload_callbacks callbacks;</text>
  <text x="700" y="500" font-family="monospace" font-size="12" fill="#555"
        dominant-baseline="central">unsigned int             flags;</text>
  <text x="700" y="522" font-family="monospace" font-size="12" fill="#333"
        dominant-baseline="central">};</text>
  <text x="680" y="550" font-family="monospace" font-size="11" fill="#C62828"
        dominant-baseline="central">// 无 list_head，无 protocol 字段——下标即 reg 时传的 protocol 参数</text>
  <text x="680" y="574" font-family="monospace" font-size="11" fill="#888"
        dominant-baseline="central">// 注册参数不存入结构体，只用于定位数组槽位</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43A047"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF8F00"/>
    </marker>
  </defs>
</svg>
