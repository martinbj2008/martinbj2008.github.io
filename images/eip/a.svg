<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1250" viewBox="0 0 1380 1250">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#5E35B1" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FAFF"/>
      <stop offset="100%" stop-color="#EFF3F8"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E35B1"/>
      <stop offset="100%" stop-color="#7E57C2"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F1FD"/>
      <stop offset="100%" stop-color="#D3E4FB"/>
    </linearGradient>
    <linearGradient id="grad-gray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F6F8"/>
      <stop offset="100%" stop-color="#E6E9ED"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9F7EF"/>
      <stop offset="100%" stop-color="#D2EEDD"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6E1"/>
      <stop offset="100%" stop-color="#FFE8B8"/>
    </linearGradient>
    <linearGradient id="grad-magenta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8ECFB"/>
      <stop offset="100%" stop-color="#EFD8F5"/>
    </linearGradient>
    <linearGradient id="grad-eip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E1ECFB"/>
    </linearGradient>
    <linearGradient id="title-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1565C0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1565C0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #0D47A1; }
    .layer { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #1565C0; }
    .layer-sub { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 11px; fill: #90A4AE; }
    .field { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #555; }
    .field-label { fill: #90A4AE; }
    .field-value { font-weight: bold; }
    .note { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 11px; fill: #78909C; }
    .legend { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 12px; fill: #37474F; }
    .eip-title { font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: bold; fill: #0D47A1; }
    .eip-ip { font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: bold; fill: #C62828; }
    .small-title { font-family: Consolas, "Courier New", monospace; font-size: 11px; font-weight: bold; fill: #6A1B9A; }
    .small-ip { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #1565C0; }
  </style>

  <rect width="1380" height="1250" fill="url(#bg-grad)"/>

  <text x="690" y="40" class="title" text-anchor="middle" dominant-baseline="central">内网多终端独立公网IP上网网络架构图</text>
  <rect x="470" y="58" width="440" height="2" fill="url(#title-line)"/>

  <!-- ================= 层标签 ================= -->
  <text x="40" y="100" class="layer" dominant-baseline="central">第 1 层 · 远端服务器</text>
  <text x="40" y="118" class="layer-sub" dominant-baseline="central">多个 EIP 出口</text>

  <text x="40" y="244" class="layer" dominant-baseline="central">第 2 层 · 公网侧</text>
  <text x="40" y="262" class="layer-sub" dominant-baseline="central">Internet</text>

  <text x="40" y="405" class="layer" dominant-baseline="central">第 3 层 · 接入 / NAT</text>
  <text x="40" y="423" class="layer-sub" dominant-baseline="central">光猫 / 路由器</text>

  <text x="40" y="624" class="layer" dominant-baseline="central">第 4 层 · 网关 / 转发</text>
  <text x="40" y="642" class="layer-sub" dominant-baseline="central">X86 盒子（A 口 ↔ B 口）</text>

  <text x="40" y="784" class="layer" dominant-baseline="central">第 5 层 · 无线扩展</text>
  <text x="40" y="802" class="layer-sub" dominant-baseline="central">底层WIFI路由器</text>

  <text x="40" y="979" class="layer" dominant-baseline="central">第 6 层 · 终端</text>
  <text x="40" y="997" class="layer-sub" dominant-baseline="central">WiFi 接入终端</text>

  <!-- ================= 第 1 层：远端服务器 ================= -->
  <rect x="350" y="85" width="680" height="120" rx="10" ry="10"
        fill="#FFFFFF" stroke="#7E57C2" stroke-width="1.8" stroke-dasharray="9,5"
        filter="url(#shadow)"/>
  <rect x="366" y="73" width="112" height="26" rx="13" ry="13"
        fill="url(#grad-purple)" filter="url(#glow)"/>
  <circle cx="382" cy="86" r="4" fill="#FFFFFF"/>
  <text x="394" y="87" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12"
        font-weight="bold" fill="#FFFFFF" dominant-baseline="central">远端服务器</text>

  <rect x="365" y="130" width="140" height="60" rx="6" ry="6" fill="url(#grad-eip)" filter="url(#shadow-soft)"/>
  <rect x="365" y="130" width="140" height="60" rx="6" ry="6" fill="none" stroke="#5E35B1" stroke-width="1.2"/>
  <text x="435" y="150" class="eip-title" text-anchor="middle" dominant-baseline="central">EIP-1</text>
  <text x="435" y="173" class="eip-ip" text-anchor="middle" dominant-baseline="central">124.127.124.10</text>

  <rect x="535" y="130" width="140" height="60" rx="6" ry="6" fill="url(#grad-eip)" filter="url(#shadow-soft)"/>
  <rect x="535" y="130" width="140" height="60" rx="6" ry="6" fill="none" stroke="#5E35B1" stroke-width="1.2"/>
  <text x="605" y="150" class="eip-title" text-anchor="middle" dominant-baseline="central">EIP-2</text>
  <text x="605" y="173" class="eip-ip" text-anchor="middle" dominant-baseline="central">124.127.124.11</text>

  <rect x="705" y="130" width="140" height="60" rx="6" ry="6" fill="url(#grad-eip)" filter="url(#shadow-soft)"/>
  <rect x="705" y="130" width="140" height="60" rx="6" ry="6" fill="none" stroke="#5E35B1" stroke-width="1.2"/>
  <text x="775" y="150" class="eip-title" text-anchor="middle" dominant-baseline="central">EIP-3</text>
  <text x="775" y="173" class="eip-ip" text-anchor="middle" dominant-baseline="central">124.127.124.12</text>

  <rect x="875" y="130" width="140" height="60" rx="6" ry="6" fill="url(#grad-eip)" filter="url(#shadow-soft)"/>
  <rect x="875" y="130" width="140" height="60" rx="6" ry="6" fill="none" stroke="#5E35B1" stroke-width="1.2"/>
  <text x="945" y="150" class="eip-title" text-anchor="middle" dominant-baseline="central">EIP-4</text>
  <text x="945" y="173" class="eip-ip" text-anchor="middle" dominant-baseline="central">124.127.124.13</text>

  <!-- ================= 第 2 层：Internet ================= -->
  <rect x="540" y="261" width="300" height="85" rx="10" ry="10" fill="url(#grad-blue)" filter="url(#shadow)"/>
  <rect x="540" y="261" width="300" height="30" rx="10" ry="10" fill="#1565C0"/>
  <rect x="540" y="277" width="300" height="14" fill="#1565C0"/>
  <circle cx="560" cy="276" r="5" fill="#90CAF9"/>
  <text x="576" y="277" font-family="Consolas, monospace" font-size="13" font-weight="bold"
        fill="#FFFFFF" dominant-baseline="central">Internet / 公网</text>

  <text x="556" y="314" class="field" dominant-baseline="central">角色    <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#37474F">公网出口</tspan></text>
  <text x="556" y="334" class="field" dominant-baseline="central">说明    <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#37474F">上层互联网</tspan></text>

  <rect x="540" y="261" width="300" height="85" rx="10" ry="10" fill="none" stroke="#1565C0" stroke-width="1.5"/>

  <!-- ================= 第 3 层：光猫 / 路由器 ================= -->
  <rect x="480" y="425" width="420" height="140" rx="10" ry="10" fill="url(#grad-gray)" filter="url(#shadow)"/>
  <rect x="480" y="425" width="420" height="30" rx="10" ry="10" fill="#455A64"/>
  <rect x="480" y="441" width="420" height="14" fill="#455A64"/>
  <circle cx="500" cy="440" r="5" fill="#B0BEC5"/>
  <text x="516" y="441" font-family="Consolas, monospace" font-size="13" font-weight="bold"
        fill="#FFFFFF" dominant-baseline="central">光猫 / 路由器</text>

  <text x="496" y="476" class="field" dominant-baseline="central">角色/模式<tspan class="field-label">:</tspan> <tspan class="field-value" fill="#37474F">路由 / NAT</tspan></text>
  <text x="496" y="496" class="field" dominant-baseline="central">LAN      <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#0D47A1">192.168.1.1/24</tspan></text>
  <text x="496" y="516" class="field" dominant-baseline="central">WAN      <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#37474F">动态公网 IP / PPPoE</tspan></text>
  <text x="496" y="536" class="field" dominant-baseline="central">NAT      <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#2E7D32">开启</tspan></text>
  <text x="496" y="556" class="field" dominant-baseline="central">DHCP     <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#37474F">192.168.1.0/24</tspan></text>

  <rect x="480" y="425" width="420" height="140" rx="10" ry="10" fill="none" stroke="#455A64" stroke-width="1.5"/>

  <!-- ================= 第 4 层：X86 盒子 ================= -->
  <rect x="430" y="644" width="520" height="70" rx="10" ry="10" fill="url(#grad-green)" filter="url(#shadow)"/>
  <rect x="430" y="644" width="520" height="30" rx="10" ry="10" fill="#2E7D32"/>
  <rect x="430" y="660" width="520" height="14" fill="#2E7D32"/>
  <circle cx="450" cy="659" r="5" fill="#A5D6A7"/>
  <text x="466" y="660" font-family="Consolas, monospace" font-size="13" font-weight="bold"
        fill="#FFFFFF" dominant-baseline="central">X86 盒子</text>

  <text x="446" y="697" class="field" dominant-baseline="central">A 口 接光猫 LAN，B 口: 接底层WIFI路由器</text>

  <rect x="430" y="644" width="520" height="70" rx="10" ry="10" fill="none" stroke="#2E7D32" stroke-width="1.5"/>

  <!-- ================= 第 5 层：底层WIFI路由器 ================= -->
  <rect x="490" y="804" width="400" height="105" rx="10" ry="10" fill="url(#grad-orange)" filter="url(#shadow)"/>
  <rect x="490" y="804" width="400" height="30" rx="10" ry="10" fill="#E65100"/>
  <rect x="490" y="820" width="400" height="14" fill="#E65100"/>
  <circle cx="510" cy="819" r="5" fill="#FFCC80"/>
  <text x="526" y="820" font-family="Consolas, monospace" font-size="13" font-weight="bold"
        fill="#FFFFFF" dominant-baseline="central">底层WIFI路由器</text>

  <text x="506" y="856" class="field" dominant-baseline="central">上联口  <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#37474F">接 X86 B 口</tspan></text>
  <text x="506" y="876" class="field" dominant-baseline="central">管理 IP <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#0D47A1">192.168.199.2/24</tspan></text>
  <text x="506" y="896" class="field" dominant-baseline="central">无线    <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#E65100">SSID WiFi-199 / WPA2/WPA3</tspan></text>

  <rect x="490" y="804" width="400" height="105" rx="10" ry="10" fill="none" stroke="#E65100" stroke-width="1.5"/>

  <!-- ================= 第 6 层：终端 ================= -->
  <rect x="240" y="999" width="300" height="140" rx="10" ry="10" fill="url(#grad-magenta)" filter="url(#shadow)"/>
  <rect x="240" y="999" width="300" height="30" rx="10" ry="10" fill="#6A1B9A"/>
  <rect x="240" y="1015" width="300" height="14" fill="#6A1B9A"/>
  <circle cx="260" cy="1014" r="5" fill="#CE93D8"/>
  <text x="276" y="1015" font-family="Consolas, monospace" font-size="12" font-weight="bold"
        fill="#FFFFFF" dominant-baseline="central">终端 192.168.199.100</text>

  <text x="256" y="1049" class="field" dominant-baseline="central">角色    <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#37474F">目标 WiFi 终端</tspan></text>
  <text x="256" y="1069" class="field" dominant-baseline="central">IP      <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#6A1B9A">192.168.199.100/24</tspan></text>
  <text x="256" y="1089" class="field" dominant-baseline="central">网关    <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#0D47A1">192.168.199.1</tspan></text>
  <text x="256" y="1109" class="field" dominant-baseline="central">DNS     <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#0D47A1">192.168.199.1</tspan></text>
  <text x="256" y="1129" class="field" dominant-baseline="central">接入    <tspan class="field-label">:</tspan> <tspan class="field-value" fill="#E65100">WiFi-199</tspan></text>

  <rect x="240" y="999" width="300" height="140" rx="10" ry="10" fill="none" stroke="#6A1B9A" stroke-width="1.8"/>

  <rect x="560" y="999" width="180" height="65" rx="8" ry="8" fill="#FFFFFF" filter="url(#shadow-soft)"/>
  <rect x="560" y="999" width="180" height="24" rx="8" ry="8" fill="#F3E5F5"/>
  <rect x="560" y="1014" width="180" height="9" fill="#F3E5F5"/>
  <text x="650" y="1011" class="small-title" text-anchor="middle" dominant-baseline="central">终端 .101</text>
  <text x="650" y="1042" class="small-ip" text-anchor="middle" dominant-baseline="central">192.168.199.101</text>
  <rect x="560" y="999" width="180" height="65" rx="8" ry="8" fill="none" stroke="#8E24AA" stroke-width="1.2"/>

  <rect x="760" y="999" width="180" height="65" rx="8" ry="8" fill="#FFFFFF" filter="url(#shadow-soft)"/>
  <rect x="760" y="999" width="180" height="24" rx="8" ry="8" fill="#F3E5F5"/>
  <rect x="760" y="1014" width="180" height="9" fill="#F3E5F5"/>
  <text x="850" y="1011" class="small-title" text-anchor="middle" dominant-baseline="central">终端 .102</text>
  <text x="850" y="1042" class="small-ip" text-anchor="middle" dominant-baseline="central">192.168.199.102</text>
  <rect x="760" y="999" width="180" height="65" rx="8" ry="8" fill="none" stroke="#8E24AA" stroke-width="1.2"/>

  <rect x="960" y="999" width="180" height="65" rx="8" ry="8" fill="#FFFFFF" filter="url(#shadow-soft)"/>
  <rect x="960" y="999" width="180" height="24" rx="8" ry="8" fill="#F3E5F5"/>
  <rect x="960" y="1014" width="180" height="9" fill="#F3E5F5"/>
  <text x="1050" y="1011" class="small-title" text-anchor="middle" dominant-baseline="central">终端 .103</text>
  <text x="1050" y="1042" class="small-ip" text-anchor="middle" dominant-baseline="central">192.168.199.103</text>
  <rect x="960" y="999" width="180" height="65" rx="8" ry="8" fill="none" stroke="#8E24AA" stroke-width="1.2"/>

  <!-- ================= 连接线 ================= -->
  <path d="M 690 205 L 690 261" fill="none" stroke="#546E7A" stroke-width="2"/>
  <rect x="700" y="215" width="72" height="20" rx="10" ry="10" fill="#ECEFF1"/>
  <text x="736" y="226" class="note" text-anchor="middle" dominant-baseline="central">公网可达</text>

  <path d="M 690 346 L 690 425" fill="none" stroke="#546E7A" stroke-width="2"/>
  <rect x="700" y="366" width="126" height="20" rx="10" ry="10" fill="#ECEFF1"/>
  <text x="763" y="377" class="note" text-anchor="middle" dominant-baseline="central">WAN 上行 / 光猫 NAT</text>

  <path d="M 690 565 L 690 644" fill="none" stroke="#546E7A" stroke-width="2"/>
  <rect x="700" y="585" width="158" height="20" rx="10" ry="10" fill="#ECEFF1"/>
  <text x="779" y="596" class="note" text-anchor="middle" dominant-baseline="central">LAN 网线 / 192.168.1.0/24</text>

  <path d="M 690 714 L 690 804" fill="none" stroke="#546E7A" stroke-width="2"/>
  <rect x="700" y="739" width="66" height="20" rx="10" ry="10" fill="#ECEFF1"/>
  <text x="733" y="750" class="note" text-anchor="middle" dominant-baseline="central">B 口有线</text>

  <path d="M 690 909 L 690 977" fill="none" stroke="#546E7A" stroke-width="2"/>
  <line x1="390" y1="977" x2="1050" y2="977" stroke="#546E7A" stroke-width="2"/>
  <path d="M 390 977 L 390 999" fill="none" stroke="#546E7A" stroke-width="2"/>
  <path d="M 650 977 L 650 999" fill="none" stroke="#546E7A" stroke-width="2"/>
  <path d="M 850 977 L 850 999" fill="none" stroke="#546E7A" stroke-width="2"/>
  <path d="M 1050 977 L 1050 999" fill="none" stroke="#546E7A" stroke-width="2"/>

  <rect x="680" y="948" width="128" height="20" rx="10" ry="10" fill="#ECEFF1"/>
  <text x="744" y="959" class="note" text-anchor="middle" dominant-baseline="central">SSID: WiFi-199</text>

  <!-- ================= 图例 ================= -->
  <rect x="40" y="1189" width="300" height="46" rx="8" ry="8"
        fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1" filter="url(#shadow-soft)"/>

  <line x1="58" y1="1212" x2="98" y2="1212" stroke="#546E7A" stroke-width="2"/>
  <text x="108" y="1213" class="legend" dominant-baseline="central">物理链路</text>

  <rect x="180" y="1208" width="40" height="8" rx="4" ry="4"
        fill="none" stroke="#7E57C2" stroke-width="1.8" stroke-dasharray="6,3"/>
  <text x="230" y="1213" class="legend" dominant-baseline="central">远端服务器</text>
</svg>
