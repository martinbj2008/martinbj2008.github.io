<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 142" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="eg-nh0" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="eg-nh1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="eg-nh2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- Tick labels ABOVE scale bar -->
  <text x="40"  y="22" text-anchor="middle" font-size="10" fill="#666">0</text>
  <text x="273" y="22" text-anchor="start" font-size="10" fill="#666">715827882</text>
  <text x="507" y="22" text-anchor="start" font-size="10" fill="#666">1431655764</text>
  <text x="740" y="22" text-anchor="end" font-size="10" fill="#666">2147483646</text>

  <!-- Tick marks -->
  <line x1="40"  y1="28" x2="40"  y2="40" stroke="#555" stroke-width="1.5"/>
  <line x1="273" y1="28" x2="273" y2="40" stroke="#555" stroke-width="1.5"/>
  <line x1="507" y1="28" x2="507" y2="40" stroke="#555" stroke-width="1.5"/>
  <line x1="740" y1="28" x2="740" y2="40" stroke="#555" stroke-width="1.5"/>

  <!-- Scale bar -->
  <rect x="40" y="32" width="700" height="8" rx="4" fill="#E0E0E0"/>
  <rect x="40" y="32" width="233" height="8" rx="4" fill="url(#eg-nh0)"/>
  <rect x="273" y="32" width="234" height="8" fill="url(#eg-nh1)"/>
  <rect x="507" y="32" width="233" height="8" rx="4" fill="url(#eg-nh2)"/>

  <!-- NH0 box: directly below scale, width matches interval (233px) -->
  <rect x="40" y="44" width="233" height="56" rx="6" fill="url(#eg-nh0)" opacity="0.15" stroke="#0288D1" stroke-width="1.5"/>
  <rect x="40" y="44" width="233" height="22" rx="6" fill="url(#eg-nh0)"/>
  <rect x="40" y="56" width="233" height="10" fill="url(#eg-nh0)"/>
  <text x="156" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">NH 0</text>
  <text x="156" y="80" text-anchor="middle" font-size="11" fill="#0277BD">weight = 1</text>
  <text x="156" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#01579B">33.3%</text>

  <!-- NH1 box: directly below scale, width matches interval (234px) -->
  <rect x="273" y="44" width="234" height="56" rx="6" fill="url(#eg-nh1)" opacity="0.15" stroke="#388E3C" stroke-width="1.5"/>
  <rect x="273" y="44" width="234" height="22" rx="6" fill="url(#eg-nh1)"/>
  <rect x="273" y="56" width="234" height="10" fill="url(#eg-nh1)"/>
  <text x="390" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">NH 1</text>
  <text x="390" y="80" text-anchor="middle" font-size="11" fill="#2E7D32">weight = 1</text>
  <text x="390" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">33.3%</text>

  <!-- NH2 box: directly below scale, width matches interval (233px) -->
  <rect x="507" y="44" width="233" height="56" rx="6" fill="url(#eg-nh2)" opacity="0.15" stroke="#F57C00" stroke-width="1.5"/>
  <rect x="507" y="44" width="233" height="22" rx="6" fill="url(#eg-nh2)"/>
  <rect x="507" y="56" width="233" height="10" fill="url(#eg-nh2)"/>
  <text x="623" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">NH 2</text>
  <text x="623" y="80" text-anchor="middle" font-size="11" fill="#E65100">weight = 1</text>
  <text x="623" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#BF360C">33.3%</text>

  <!-- Title at bottom -->
  <text x="390" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">hash 值空间  ( 0 ~ 2³¹ − 1 )</text>
