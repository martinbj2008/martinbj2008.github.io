<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 142" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="wt-nh0" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="wt-nh1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="wt-nh2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- Tick labels ABOVE scale bar -->
  <text x="40"  y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#666">0</text>
  <text x="215" y="22" text-anchor="start" font-size="11" font-weight="bold" fill="#666">536870911</text>
  <text x="565" y="22" text-anchor="end" font-size="11" font-weight="bold" fill="#666">1610612735</text>
  <text x="740" y="22" text-anchor="end" font-size="11" font-weight="bold" fill="#666">2147483646</text>

  <!-- Tick marks -->
  <line x1="40"  y1="28" x2="40"  y2="40" stroke="#555" stroke-width="1.5"/>
  <line x1="215" y1="28" x2="215" y2="40" stroke="#555" stroke-width="1.5"/>
  <line x1="565" y1="28" x2="565" y2="40" stroke="#555" stroke-width="1.5"/>
  <line x1="740" y1="28" x2="740" y2="40" stroke="#555" stroke-width="1.5"/>

  <!-- Scale bar -->
  <rect x="40" y="32" width="700" height="8" rx="4" fill="#E0E0E0"/>
  <rect x="40" y="32" width="175" height="8" rx="4" fill="url(#wt-nh0)"/>
  <rect x="215" y="32" width="350" height="8" fill="url(#wt-nh1)"/>
  <rect x="565" y="32" width="175" height="8" rx="4" fill="url(#wt-nh2)"/>

  <!-- NH0 box: width matches interval (175px) -->
  <rect x="40" y="44" width="175" height="56" rx="6" fill="url(#wt-nh0)" opacity="0.15" stroke="#0288D1" stroke-width="1.5"/>
  <rect x="40" y="44" width="175" height="22" rx="6" fill="url(#wt-nh0)"/>
  <rect x="40" y="56" width="175" height="10" fill="url(#wt-nh0)"/>
  <text x="127" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">NH 0</text>
  <text x="127" y="80" text-anchor="middle" font-size="11" fill="#0277BD">weight = 1</text>
  <text x="127" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#01579B">25%</text>

  <!-- NH1 box: width matches interval (350px) -->
  <rect x="215" y="44" width="350" height="56" rx="6" fill="url(#wt-nh1)" opacity="0.15" stroke="#388E3C" stroke-width="1.5"/>
  <rect x="215" y="44" width="350" height="22" rx="6" fill="url(#wt-nh1)"/>
  <rect x="215" y="56" width="350" height="10" fill="url(#wt-nh1)"/>
  <text x="390" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">NH 1</text>
  <text x="390" y="80" text-anchor="middle" font-size="11" fill="#2E7D32">weight = 2</text>
  <text x="390" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">50%</text>

  <!-- NH2 box: width matches interval (175px) -->
  <rect x="565" y="44" width="175" height="56" rx="6" fill="url(#wt-nh2)" opacity="0.15" stroke="#F57C00" stroke-width="1.5"/>
  <rect x="565" y="44" width="175" height="22" rx="6" fill="url(#wt-nh2)"/>
  <rect x="565" y="56" width="175" height="10" fill="url(#wt-nh2)"/>
  <text x="653" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">NH 2</text>
  <text x="653" y="80" text-anchor="middle" font-size="11" fill="#E65100">weight = 1</text>
  <text x="653" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#BF360C">25%</text>

  <!-- Title at bottom -->
  <text x="390" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">hash 值空间  ( 0 ~ 2³¹ − 1 )    weight = 1 : 2 : 1</text>
</svg>
