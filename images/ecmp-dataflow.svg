<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="df-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="df-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="df-orange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA726;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="df-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#AB47BC;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6A1B9A;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="df-teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#26A69A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00695C;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#555">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrowhead-dash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#999">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" fill="#FAFAFA" rx="8"/>

  <!-- Title -->
  <text x="440" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">ECMP 完整数据流 (Full Data Flow)</text>

  <!-- ===== Participant lifelines ===== -->
  <!-- PKT -->
  <rect x="30" y="50" width="140" height="36" rx="6" fill="url(#df-blue)" filter="url(#shadow)"/>
  <text x="100" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">数据包 / flowi4</text>
  <line x1="100" y1="86" x2="100" y2="490" stroke="#42A5F5" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- FIB -->
  <rect x="230" y="50" width="160" height="36" rx="6" fill="url(#df-green)" filter="url(#shadow)"/>
  <text x="310" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">fib_select_path()</text>
  <line x1="310" y1="86" x2="310" y2="490" stroke="#66BB6A" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- HASH -->
  <rect x="440" y="50" width="180" height="36" rx="6" fill="url(#df-orange)" filter="url(#shadow)"/>
  <text x="530" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">fib_multipath_hash()</text>
  <line x1="530" y1="86" x2="530" y2="490" stroke="#FFA726" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- SEL -->
  <rect x="660" y="50" width="190" height="36" rx="6" fill="url(#df-purple)" filter="url(#shadow)"/>
  <text x="755" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">fib_select_multipath()</text>
  <line x1="755" y1="86" x2="755" y2="490" stroke="#AB47BC" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== Message 1: PKT -> FIB ===== -->
  <line x1="100" y1="120" x2="300" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="200" y="114" text-anchor="middle" font-size="11" fill="#333">命中路由(FA/FI)</text>

  <!-- ===== Message 2: FIB -> HASH ===== -->
  <line x1="310" y1="160" x2="520" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="415" y="154" text-anchor="middle" font-size="11" fill="#333">路由有多个nexthop，计算hash</text>

  <!-- ===== Note over HASH ===== -->
  <rect x="430" y="180" width="200" height="70" rx="6" fill="#FFF3E0" stroke="#FFA726" stroke-width="1"/>
  <text x="530" y="198" text-anchor="middle" font-size="10" fill="#E65100">根据 hash_policy sysctl 提取</text>
  <text x="530" y="214" text-anchor="middle" font-size="10" fill="#E65100">{saddr, daddr, sport, dport, proto}</text>
  <text x="530" y="230" text-anchor="middle" font-size="10" fill="#E65100">调用 SipHash / jhash2 计算 hash</text>
  <text x="530" y="244" text-anchor="middle" font-size="10" font-weight="bold" fill="#BF360C">mhash = hash_fn(keys) &gt;&gt; 1</text>

  <!-- ===== Message 3: HASH --> FIB (return) ===== -->
  <line x1="520" y1="270" x2="320" y2="270" stroke="#999" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-dash)"/>
  <text x="420" y="264" text-anchor="middle" font-size="11" fill="#666">返回 mhash &gt;&gt; 1（正整数）</text>

  <!-- ===== Message 4: FIB -> SEL ===== -->
  <line x1="310" y1="310" x2="745" y2="310" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
<text x="528" y="304" text-anchor="middle" font-size="11" fill="#333">传入 hash + fl4，选nexthop</text>

  <!-- ===== Note over SEL ===== -->
  <rect x="640" y="330" width="230" height="90" rx="6" fill="#F3E5F5" stroke="#AB47BC" stroke-width="1"/>
  <text x="755" y="348" text-anchor="middle" font-size="10" fill="#6A1B9A">遍历每个 nexthop：</text>
  <text x="755" y="366" text-anchor="middle" font-size="10" fill="#6A1B9A">1. 跳过 dead / linkdown / 邻居不可达</text>
  <text x="755" y="382" text-anchor="middle" font-size="10" fill="#6A1B9A">2. 源地址匹配 → +2 分</text>
  <text x="755" y="398" text-anchor="middle" font-size="10" fill="#6A1B9A">3. hash ≤ upper_bound → +1 分</text>
  <text x="755" y="414" text-anchor="middle" font-size="10" font-weight="bold" fill="#4A148C">4. 选最高分的 nexthop</text>

  <!-- ===== Message 5: SEL --> result ===== -->
  <line x1="745" y1="445" x2="320" y2="445" stroke="#999" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-dash)"/>
  <text x="530" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A148C">res->nhc = 选中的 nexthop</text>

  <!-- ===== Bottom result ===== -->
  <line x1="300" y1="470" x2="110" y2="470" stroke="#999" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-dash)"/>
  <text x="200" y="464" text-anchor="middle" font-size="11" fill="#666">返回结果</text>

  <!-- Bottom labels -->
  <text x="100" y="506" text-anchor="middle" font-size="9" fill="#999">net/ipv4/route.c</text>
  <text x="310" y="506" text-anchor="middle" font-size="9" fill="#999">net/ipv4/fib_semantics.c</text>
  <text x="530" y="506" text-anchor="middle" font-size="9" fill="#999">net/ipv4/route.c</text>
  <text x="755" y="506" text-anchor="middle" font-size="9" fill="#999">net/ipv4/fib_semantics.c</text>
</svg>