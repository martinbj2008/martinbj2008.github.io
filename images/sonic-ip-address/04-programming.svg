<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 765" role="img" aria-labelledby="title desc">
  <title id="title">04 / 接口状态与路由下发</title>
  <desc id="desc">步骤 13–17 · 延续原图的 SAI/SDK/HW 与 ASIC_DB 简化表示；消息从上向下阅读，保留原 ASCII 图的步骤编号。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#263238"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #263238; }
    .message { font-family: Consolas, 'Liberation Mono', monospace; font-size: 17px; font-weight: 600; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
    .detail { font-family: Consolas, 'Liberation Mono', monospace; font-size: 16px; fill: #52616b; paint-order: stroke; stroke: white; stroke-width: 4px; }
  </style>
  <rect width="960" height="765" rx="12" fill="white"/>
  <rect x="1" y="1" width="958" height="763" rx="12" fill="none" stroke="#dce3ea"/>
  <text x="32" y="42" font-size="23" font-weight="700" fill="#1565c0">04 / 接口状态与路由下发</text>
  <text x="32" y="74" font-size="16" fill="#52616b">步骤 13–17 · 延续原图的 SAI/SDK/HW 与 ASIC_DB 简化表示</text>
  <line x1="110" y1="164" x2="110" y2="700" stroke="#bcc8d2" stroke-width="1.5" stroke-dasharray="5 6"/>
  <rect x="24" y="110" width="172" height="54" rx="7" fill="#e8f5e9" stroke="#256332" stroke-width="1.5"/>
  <text x="110" y="143" text-anchor="middle" font-size="17" font-weight="700" style="fill:#256332">IntfOrch</text>
  <line x1="356.667" y1="164" x2="356.667" y2="700" stroke="#bcc8d2" stroke-width="1.5" stroke-dasharray="5 6"/>
  <rect x="270.667" y="110" width="172" height="54" rx="7" fill="#e8f5e9" stroke="#256332" stroke-width="1.5"/>
  <text x="356.667" y="143" text-anchor="middle" font-size="17" font-weight="700" style="fill:#256332">RouteOrch</text>
  <line x1="603.333" y1="164" x2="603.333" y2="700" stroke="#bcc8d2" stroke-width="1.5" stroke-dasharray="5 6"/>
  <rect x="517.333" y="110" width="172" height="54" rx="7" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="603.333" y="143" text-anchor="middle" font-size="17" font-weight="700" style="fill:#7b1fa2">SAI / SDK / HW</text>
  <line x1="850" y1="164" x2="850" y2="700" stroke="#bcc8d2" stroke-width="1.5" stroke-dasharray="5 6"/>
  <rect x="764" y="110" width="172" height="54" rx="7" fill="#fff8e1" stroke="#9a5800" stroke-width="1.5"/>
  <text x="850" y="143" text-anchor="middle" font-size="17" font-weight="700" style="fill:#9a5800">ASIC_DB</text>
  <g>
    <title>13. Query · RIF Status</title>
    <line x1="356.667" y1="225" x2="110" y2="225" stroke="#263238" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text class="message" x="233.333" y="211" text-anchor="middle">13. Query</text>
    <text class="detail" x="233.333" y="250" text-anchor="middle">RIF Status</text>
  </g>
  <g>
    <title>14. Ready</title>
    <line x1="110" y1="325" x2="356.667" y2="325" stroke="#263238" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text class="message" x="233.333" y="311" text-anchor="middle">14. Ready</text>
  </g>
  <g>
    <title>15. SAI Call · Route / FIBs</title>
    <line x1="356.667" y1="425" x2="603.333" y2="425" stroke="#263238" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text class="message" x="480" y="411" text-anchor="middle">15. SAI Call</text>
    <text class="detail" x="480" y="450" text-anchor="middle">Route / FIBs</text>
  </g>
  <g>
    <title>16. status · Hardware ACK</title>
    <line x1="603.333" y1="525" x2="356.667" y2="525" stroke="#263238" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text class="message" x="480" y="511" text-anchor="middle">16. status</text>
    <text class="detail" x="480" y="550" text-anchor="middle">Hardware ACK</text>
  </g>
  <g>
    <title>17. Redis SET · ROUTE_TABLE</title>
    <line x1="356.667" y1="625" x2="850" y2="625" stroke="#263238" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text class="message" x="603.333" y="611" text-anchor="middle">17. Redis SET</text>
    <text class="detail" x="603.333" y="650" text-anchor="middle">ROUTE_TABLE</text>
  </g>
  <text x="32" y="740" font-size="15" fill="#52616b">按原 ASCII 图重绘；实线表示消息，虚线表示返回。</text>
</svg>
