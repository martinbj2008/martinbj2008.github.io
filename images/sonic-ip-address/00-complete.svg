<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1880 1930" role="img" aria-labelledby="title desc">
  <title id="title">SONiC / 新增 IP 地址完整时序</title>
  <desc id="desc">10 个参与者 · 17 个步骤 · 从上向下阅读；消息从上向下阅读，保留原 ASCII 图的步骤编号。</desc>
