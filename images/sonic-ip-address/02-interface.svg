    .message { font-family: Consolas, 'Liberation Mono', monospace; font-size: 17px; font-weight: 600; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
    .detail { font-family: Consolas, 'Liberation Mono', monospace; font-size: 16px; fill: #52616b; paint-order: stroke; stroke: white; stroke-width: 4px; }
