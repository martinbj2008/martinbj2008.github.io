<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
  <title id="title">01 / 配置下发</title>
  <desc id="desc">步骤 1–3 · User/CLI → CONFIG_DB → intfmgrd → Linux Kernel；消息从上向下阅读，保留原 ASCII 图的步骤编号。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#263238"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #263238; }
    .message { font-family: Consolas, 'Liberation Mono', monospace; font-size: 17px; font-weight: 600; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
    .detail { font-family: Consolas, 'Liberation Mono', monospace; font-size: 16px; fill: #52616b; paint-order: stroke; stroke: white; stroke-width: 4px; }
  </style>
  <rect width="960" height="530" rx="12" fill="white"/>
  <rect x="1" y="1" width="958" height="528" rx="12" fill="none" stroke="#dce3ea"/>
  <text x="32" y="42" font-size="23" font-weight="700" fill="#1565c0">01 / 配置下发</text>
  <text x="32" y="74" font-size="16" fill="#52616b">步骤 1–3 · User/CLI → CONFIG_DB → intfmgrd → Linux Kernel</text>
  <line x1="110" y1="164" x2="110" y2="465" stroke="#bcc8d2" stroke-width="1.5" stroke-dasharray="5 6"/>
  <rect x="24" y="110" width="172" height="54" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="110" y="143" text-anchor="middle" font-size="17" font-weight="700" style="fill:#4338ca">User / CLI</text>
  <line x1="356.667" y1="164" x2="356.667" y2="465" stroke="#bcc8d2" stroke-width="1.5" stroke-dasharray="5 6"/>
  <rect x="270.667" y="110" width="172" height="54" rx="7" fill="#fff8e1" stroke="#9a5800" stroke-width="1.5"/>
  <text x="356.667" y="143" text-anchor="middle" font-size="17" font-weight="700" style="fill:#9a5800">CONFIG_DB</text>
  <line x1="603.333" y1="164" x2="603.333" y2="465" stroke="#bcc8d2" stroke-width="1.5" stroke-dasharray="5 6"/>
  <rect x="517.333" y="110" width="172" height="54" rx="7" fill="#e8f5e9" stroke="#256332" stroke-width="1.5"/>
  <text x="603.333" y="143" text-anchor="middle" font-size="17" font-weight="700" style="fill:#256332">intfmgrd</text>
  <line x1="850" y1="164" x2="850" y2="465" stroke="#bcc8d2" stroke-width="1.5" stroke-dasharray="5 6"/>
  <rect x="764" y="110" width="172" height="54" rx="7" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="850" y="143" text-anchor="middle" font-size="17" font-weight="700" style="fill:#1565c0">Linux Kernel</text>
  <g>
    <title>1. SET · INTERFACE</title>
    <line x1="110" y1="225" x2="356.667" y2="225" stroke="#263238" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text class="message" x="233.333" y="211" text-anchor="middle">1. SET</text>
    <text class="detail" x="233.333" y="250" text-anchor="middle">INTERFACE</text>
  </g>
  <g>
    <title>2. SUB · INTERFACE</title>
    <line x1="356.667" y1="325" x2="603.333" y2="325" stroke="#263238" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text class="message" x="480" y="311" text-anchor="middle">2. SUB</text>
    <text class="detail" x="480" y="350" text-anchor="middle">INTERFACE</text>
  </g>
  <g>
    <title>3. nl_send · RTM_NEWADDR</title>
    <line x1="603.333" y1="425" x2="850" y2="425" stroke="#263238" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text class="message" x="726.667" y="411" text-anchor="middle">3. nl_send</text>
    <text class="detail" x="726.667" y="450" text-anchor="middle">RTM_NEWADDR</text>
  </g>
  <text x="32" y="505" font-size="15" fill="#52616b">接续图 02：从 Linux Kernel 的 NEWADDR 通知继续。</text>
</svg>
